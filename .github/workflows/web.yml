name: web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docker/web.Dockerfile"
      - "docker/nginx.conf"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"

env:
  IMAGE: ghcr.io/gmottola00/jarvis-web

jobs:
  # `npm run build` runs `tsc -b` first, so a type error fails here — and
  # inside the image build, which runs the same script.
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build

  build-push-deploy:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # GitOps CD: bump the image tag in the infra repo; ArgoCD rolls it out.
      - uses: actions/checkout@v4
        with:
          repository: gmottola00/Home-Lab-Infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Bump image tag in kustomization
        working-directory: infra
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard FETCH_HEAD

            yq -i '(.images[] | select(.name == "ghcr.io/gmottola00/jarvis-web") | .newTag) = strenv(GITHUB_SHA)' apps/jarvis/kustomization.yaml

            if git diff --quiet -- apps/jarvis/kustomization.yaml; then
              echo "jarvis-web already at ${GITHUB_SHA:0:7}, nothing to bump."
              exit 0
            fi

            git commit -qam "jarvis-web: deploy ${GITHUB_SHA:0:7}"
            if git push --quiet origin HEAD:main; then
              echo "jarvis-web bumped to ${GITHUB_SHA:0:7} on attempt ${attempt}."
              exit 0
            fi
            echo "push rejected, retrying (attempt ${attempt}/5)."
            sleep $(( RANDOM % 3 + attempt ))
          done

          echo "::error::could not push the jarvis-web tag bump after 5 attempts"
          exit 1
