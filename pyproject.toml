[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis: a multimodal agent that operates the homelab. P0 — text only, web console."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Gianmarco Mottola", email = "gianmarcomottola00@gmail.com" }]

dependencies = [
    "anthropic>=0.75.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",
    "langgraph>=0.2.60",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
# Backing stores. Without these Jarvis falls back to in-process memory,
# which is enough to develop and test the whole graph but loses state on restart.
postgres = ["langgraph-checkpoint-postgres>=2.0.0", "psycopg[binary,pool]>=3.2.0"]
redis = ["redis>=5.2.0"]
k8s = ["kubernetes-asyncio>=31.1.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "black>=24.10.0",
    "isort>=5.13.0",
]
all = ["jarvis[postgres,redis,k8s]"]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["jarvis*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["kubernetes_asyncio.*", "langgraph.*", "sse_starlette.*", "redis.*", "psycopg.*", "psycopg_pool.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers"]
markers = ["script: scripted model turns for the API fixture"]
asyncio_mode = "auto"
