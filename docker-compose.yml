# Local Jarvis. Four containers: the stores, the backend, and nginx serving the
# dashboard.
#
# Nothing here is required to develop: without Postgres and Redis the backend
# falls back to in-process state. They are here because a suspended approval
# should survive a restart, and because pgvector is what long-term memory will
# want next.

name: jarvis

services:
  postgres:
    # pgvector is unused in P0 and pre-installed on purpose: it is what the
    # long-term memory in the design doc needs, and adding it later would mean
    # migrating the volume.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB: jarvis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      JARVIS_DATABASE_URL: postgresql://jarvis:jarvis@postgres:5432/jarvis
      JARVIS_REDIS_URL: redis://redis:6379/0
      # Everything else comes from .env: the API key, the capability tokens,
      # and JARVIS_FAKE_TOOLS while you are still working against fixtures.
    env_file:
      - .env
    volumes:
      # Read-only kubeconfig. Comment out until you are ready to point Jarvis at
      # the real cluster.
      - ${HOME}/.kube/config:/root/.kube/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Optional LLM gateway, same image as the cluster's. Start it with
  # `docker compose --profile gateway up`, create a key (see docker/litellm.yaml)
  # and point JARVIS_LLM_GATEWAY_URL at it.
  litellm:
    profiles: ["gateway"]
    image: ghcr.io/berriai/litellm-database:v1.105.1
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      # Own schema in the Jarvis database: no second Postgres, no clash with
      # the checkpointer tables.
      DATABASE_URL: postgresql://jarvis:jarvis@postgres:5432/jarvis?schema=litellm
      LITELLM_MASTER_KEY: sk-jarvis-dev
      LITELLM_SALT_KEY: sk-jarvis-dev-salt
      ANTHROPIC_API_KEY: ${LITELLM_ANTHROPIC_API_KEY:-}
      OLLAMA_API_BASE: ${JARVIS_OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/litellm.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
