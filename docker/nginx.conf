# Serves the SPA and proxies the API to the backend - the same shape as the web
# pods in trip-ai and tickup, so moving Jarvis onto the cluster is a copy of the
# existing pattern rather than a new one.

# BACKEND_UPSTREAM is filled in at container start by the nginx image's
# envsubst step (see web.Dockerfile): `backend:8000` under docker-compose,
# `jarvis-backend:8000` in the cluster. Only defined variables are replaced,
# so nginx's own $uri, $host and friends pass through untouched.
upstream jarvis_backend {
    server ${BACKEND_UPSTREAM};
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: unknown paths return the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        proxy_pass http://jarvis_backend;
    }

    location /api/ {
        proxy_pass http://jarvis_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-sent events: without these three the run stream is buffered and
        # the browser sees nothing until the turn is over.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # A model turn with several tool calls can take minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
